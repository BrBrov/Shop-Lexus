  <title>AutoChoose</title>

</head>

<body>
  <header class="header">
    <div class="header__wrapper">
      <a class="header__logo" href="../../index.html">
        <img class="header__logo-image" src="../../img/logo.svg" alt="Logo">
      </a>
      <nav class="header__navigator">
        <img class="header__close-img" src="../../img/close.svg" alt="Close menu">
        <ul class="header__links">
          <li class="header__link"><a href="../../pages/catalog/catalog.html">Каталог</a></li>
          <li class="header__link"><a href="../../pages/about/about.html">О нас</a></li>
          <li class="header__link"><a href="../../pages/faq/faq.html">FAQ</a></li>
          <li class="header__link"><a href="../../pages/contact/contact.html">Контакты</a></li>
          <li class="header__link"><a href="../../pages/like/like.html">Избранное</a></li>
          <li class="header__link"><a href="../../pages/auth/auth.html">Аккаунт</a></li>
          <li class="header__link"><a class="header__link-account" href=""></a></li>
        </ul>
      </nav>
      <div class="header__menu">
        <img class="header__menu-img" src="../../img/menu.svg" alt="Open menu">
      </div>
      <search class="header__search">
        <label class="header__label" for="header__input">
          <input id="header__input" class="header__input" type="text" placeholder="Поиск" autocomplete="false">
        </label>
        <button class="header__search-btn"></button>
      </search>
    </div>
  </header>
  <main id="add_car">
    <div class="add_car-wrapper">
      <h2 class="h2">Добавить авто</h2>
      <div class="add_car">
        <form action="">
          <div class="input_content">
            <div class="input_box">
              <label for="">Название</label>
              <input type="text" placeholder="Lx 760">
            </div>
            <div class="input_box">
              <label for="">Тип кузова</label>
              <input type="text" placeholder="Дизель">
            </div>
            <div class="input_box">
              <label for="">Цена</label>
              <input type="text" placeholder="$45 000">
            </div>
            <div class="input_box">
              <label for="">Марка</label>
              <input type="text" placeholder="Lexus">
            </div>
            <div class="input_box">
              <label for="">Год</label>
              <input type="text" placeholder="2024">
            </div>
            <div class="input_box">
              <label for="">Объем</label>
              <input type="text" placeholder="3.5 литра">
            </div>
            <div class="input_box">
              <label for="">Тип топлива</label>
              <input type="text" placeholder="Дизель">
            </div>
            <div class="input_box">
              <label for="">Цвет</label>
              <input type="text" placeholder="Белый">
            </div>
            <div class="input_box">
              <label for="">Привод</label>
              <input type="text" placeholder="Полный">
            </div>
          </div>
          <div class="car_img_content">
            <div class="add_img">
              <img class="add_img-image" src="../../img/car_img.png" alt="">
              <div class="add_img-file"></div>
            </div>
            <div class="adder_img">
              <div>
                <img src="../../img/add_car1.png" alt="">
              </div>
              <div><img src="../../img/add_car2.png" alt="">
              </div>
              <div> <img src="../../img/add_car3.png" alt=""></div>
              <div> <img src="../../img/add_car4.png" alt=""></div>
            </div>
          </div>
          <div class="text_box">
            <label for="car__desription">Описание</label>
            <textarea name="description" id="car__desription" spellcheck="false">LEXUS IS 300 2019 года напрямую из США! Менеджеры АвтоКаргоТрейд помогут проверить, купить, доставить любое авто с аукционов Америки. Колоссальная разница от покупки машин с аукционов США (учитывая все расходы и ремонт) 20-40% от авторынка в Беларуси.

Успейте сделать ставку на аукционе и почувствуйте непревзойденное качество и комфорт LEXUS IS 300 2019. Не упускайте свой шанс воплотить свои автомобильные мечты в реальность с АвтоКаргоТрейд!

Все лоты проходят тщательную проверку, исключены ошибки в подготовке документов, полное сопровождение до передачи автомобиля клиенту.

Офис компании находиться в Минске, авто возможно доставить в любой город Беларуси.</textarea>
          </div>
          <button>Добавить в каталог</button>
        </form>
      </div>
    </div>
  </main>
  <footer class="footer">
    <div class="footer__wrapper">
      <a href="../../index.html"><img src="../../img/AutoChoose (1).svg" alt="Logo"></a>
      <ul class="footer__links">
        <li class="footer__link"><a href="../../pages/catalog/catalog.html">Каталог</a></li>
        <li class="footer__link"><a href="../../pages/about/about.html">О нас</a></li>
        <li class="footer__link"><a href="../../pages/faq/faq.html">FAQ</a></li>
        <li class="footer__link"><a href="../../pages/contact/contact.html">Контакты</a></li>
      </ul>
      <div class="footer__info">
        <div class="footer__address"></div>
        <div class="soc_link">
          <a href=""><img src="../../img/inst.svg" alt="instagramm"></a>
          <a href=""><img src="../../img/yt.svg" alt="youtube"></a>
          <a href=""><img src="../../img/tg.svg" alt="telegramm"></a>
        </div>
        <div class="footer__address">
          г. Минск, ул Вещинского, д. 4 +375 39 357 55 35
        </div>
      </div>
    </div>
  </footer>
</body>

</html>
